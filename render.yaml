services:
  - type: web
    name: lifebot-gpt
    runtime: node
    plan: starter
    buildCommand: npm run check && npm test
    startCommand: npm start
    healthCheckPath: /
    disk:
      name: lifebot-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
